<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The SRS mark (src/lib/components/SrsMark.svelte, srs-web#462), same six shapes and paint order.
       A static file outside the token system, so colours are literal: the default theme's paper, ink
       and grey-2, flipped for a dark tab bar. Geometry source: semanticops.com/design/srs-mark-halves.svg. -->
  <style>
    .paper { fill: #f4f2ee }
    .ink { fill: #1a1a1a }
    .line { fill: none; stroke: #c8c4bc; stroke-width: 1 }
    .rim { fill: none; stroke: #1a1a1a; stroke-width: 1.25 }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1a1a1a }
      .ink { fill: #f4f2ee }
      .line { stroke: #4a4744 }
      .rim { stroke: #f4f2ee }
    }
  </style>
  <circle class="paper" cx="12" cy="12" r="10.75"/>
  <path class="ink" d="M12 1.25A10.75 10.75 0 0 1 12 22.75A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 1.25Z"/>
  <path class="line" d="M12 1.25A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 22.75"/>
  <circle class="paper" cx="12" cy="6.625" r="1.505"/>
  <circle class="ink" cx="12" cy="17.375" r="1.505"/>
  <circle class="rim" cx="12" cy="12" r="10.75"/>
</svg>
