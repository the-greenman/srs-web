<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The SRS mark (halves): paper disc, ink half, the S as a vermilion accent line, two seeds, rim. Flips in dark mode. -->
  <style>
    .a { fill: #1a1a1a }
    .b { fill: #f4f2ee }
    .s { fill: none; stroke: #cc3300; stroke-width: 1 }
    .e { fill: none; stroke: #1a1a1a; stroke-width: 1.25 }
    @media (prefers-color-scheme: dark) {
      .a { fill: #faf8f5 }
      .b { fill: #211f1d }
      .s { stroke: #ff7f56 }
      .e { stroke: #faf8f5 }
    }
  </style>
  <circle class="b" cx="12" cy="12" r="10.75"/>
  <path class="a" d="M12 1.25A10.75 10.75 0 0 1 12 22.75A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 1.25Z"/>
  <path class="s" d="M12 1.25A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 22.75"/>
  <circle class="b" cx="12" cy="6.625" r="1.505"/>
  <circle class="a" cx="12" cy="17.375" r="1.505"/>
  <circle class="e" cx="12" cy="12" r="10.75"/>
</svg>
