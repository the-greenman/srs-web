name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Non-blocking for now: the suite has known drift against the current app
    # (tracked in #173). Results stay visible without failing PRs; remove
    # continue-on-error once the suite is green.
    continue-on-error: true
    # Hard backstop so a misbehaving/hanging run can never sit for 20+ minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # WASM bindings are built and released by srs-rust, not committed here.
      # Both repos are public, so the repo-scoped GITHUB_TOKEN can read releases.
      - name: Fetch WASM bindings
        run: npm run fetch-bindings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
