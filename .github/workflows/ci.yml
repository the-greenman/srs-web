name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Advisory only — never fails the run. The srs-rust pin in scripts/ensure-bindings.mjs is
      # correct by design but goes stale silently, and a stale pin renders a migrated corpus as
      # empty instead of failing. Pins lag deliberately during a cutover, so this is a visible
      # warning rather than a gate. See the-greenman/srs#392 row 3.
      #
      # `!cancelled()`, so a lint failure does not also swallow the pin signal — otherwise a PR
      # with one lint error and a six-build-stale pin costs two round trips to learn both.
      # GITHUB_TOKEN, because unauthenticated api.github.com is rate-limited per source IP and
      # runners share egress IPs: without it the check silently reports "unchecked" instead of
      # reporting a stale pin.
      - name: Check srs-rust pin freshness
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pin-freshness.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Hard backstop so a misbehaving/hanging run can never sit for 20+ minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # WASM bindings are built and released by srs-rust, not committed here.
      # srs-rust is public, so this is an unauthenticated HTTPS download.
      - name: Fetch WASM bindings
        run: npm run fetch-bindings

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
